<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ustad Brain</title>
<style>
  html, body { margin: 0; background: #070c18; font-family: sans-serif; color: #e8f1ff; }
  svg { display: block; width: 100%; height: auto; }
  .hdr { font-size: 10px; fill: #8aa0c0; letter-spacing: .12em; }
  .lbl { font-size: 11px; fill: #e8f1ff; }
  .small { font-size: 9.5px; fill: #fbbf24; }
  #legend { font-size: 10px; color: #8aa0c0; padding: 4px 8px 8px; line-height: 1.6; }
  .sw { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin: 0 4px 0 10px; }
</style>
</head>
<body>
<svg id="g" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="legend">
  <span class="sw" style="background:#34d399"></span>seen
  <span class="sw" style="background:#5b6b86"></span>not seen
  <span class="sw" style="background:#2a3d63"></span>not checked yet
  <span class="sw" style="background:#ff3b30"></span>leading cause → part
</div>
<script>
// Draws Ustad's reasoning graph: symptoms → failure modes → parts. Input from BrainGraph.kt.
const NS = 'http://www.w3.org/2000/svg';
const W = 400, COL = [6, 146, 302], CW = [130, 142, 92], ROW = 40, TOP = 24;
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
function wrap(text, max) { // at most 2 lines
  const words = String(text).split(/\s+/), lines = [''];
  for (const w of words) {
    const l = lines[lines.length - 1];
    if ((l + ' ' + w).trim().length > max && l) { if (lines.length === 2) { lines[1] += '…'; break; } lines.push(w); }
    else lines[lines.length - 1] = (l + ' ' + w).trim();
  }
  return lines;
}
function graph(data) {
  const svg = document.getElementById('g'); svg.innerHTML = '';
  const cols = [data.symptoms || [], data.failures || [], data.parts || []];
  const rows = Math.max(1, ...cols.map(c => c.length));
  const H = TOP + rows * ROW + 4;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  ['SYMPTOMS', 'CAUSES', 'PARTS'].forEach((t, i) => { el('text', { x: COL[i] + 2, y: 14, class: 'hdr' }, svg).textContent = t; });
  const pos = {};
  cols.forEach((col, ci) => {
    const off = TOP + (rows - col.length) * ROW / 2;
    col.forEach((n, i) => { pos[(ci === 2 ? 'part:' : '') + n.id] = { x: COL[ci], y: off + i * ROW, w: CW[ci], h: ROW - 6, n, ci }; });
  });
  const focus = (data.failures || []).find(f => f.focus);
  const edgeLayer = el('g', {}, svg), nodeLayer = el('g', {}, svg);
  (data.edges || []).forEach(e => {
    const a = pos[e.from], b = pos[e.to] || pos['part:' + e.to]; if (!a || !b) return;
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2, mx = (x1 + x2) / 2;
    let color = '#2a3d63', width = .6 + e.w * 1.6, dash = '', op = .45;
    if (a.ci === 0) {
      const st = a.n.state;
      if (st === 'present') { color = '#34d399'; op = .35 + e.w * .65; if (focus && e.to === focus.id) width += 1; }
      else if (st === 'absent') { color = '#5b6b86'; dash = '3 3'; op = .5; }
    } else {
      const isFocus = focus && e.from === focus.id;
      color = isFocus ? '#ff3b30' : '#39e6ff'; op = isFocus ? 1 : .3; width = isFocus ? 2.6 : 1;
    }
    el('path', { d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`, fill: 'none', stroke: color, 'stroke-width': width, 'stroke-dasharray': dash, opacity: op }, edgeLayer);
  });
  Object.values(pos).forEach(p => {
    const g = el('g', {}, nodeLayer), n = p.n;
    let fill = '#0f1a30', stroke = '#172a4d', text = n.label || n.name;
    if (p.ci === 0) { if (n.state === 'present') { stroke = '#34d399'; text = '✓ ' + text; } else if (n.state === 'absent') { stroke = '#5b6b86'; text = '✗ ' + text; } }
    if (p.ci === 1) { stroke = n.focus ? '#ff3b30' : '#39e6ff'; if (n.focus) fill = '#2a0f14'; }
    if (p.ci === 2 && focus && focus.part === n.id) { stroke = '#ff3b30'; fill = '#2a0f14'; }
    el('rect', { x: p.x, y: p.y, width: p.w, height: p.h, rx: 7, ry: 7, fill, stroke, 'stroke-width': p.ci === 1 && n.focus ? 2 : 1 }, g);
    if (p.ci === 1) { // probability bar
      el('rect', { x: p.x + 4, y: p.y + p.h - 5, width: p.w - 8, height: 2.5, fill: '#13213d', rx: 1 }, g);
      el('rect', { x: p.x + 4, y: p.y + p.h - 5, width: Math.max(1, (p.w - 8) * n.p), height: 2.5, fill: n.focus ? '#ff3b30' : '#39e6ff', rx: 1 }, g);
    }
    const lines = wrap(p.ci === 1 ? `${Math.round(n.p * 100)}% ${text}` : text, p.ci === 2 ? 15 : 22);
    lines.forEach((l, i) => { el('text', { x: p.x + 5, y: p.y + (lines.length === 1 ? 20 : 14 + i * 12), class: 'lbl' }, g).textContent = l; });
    if (p.ci === 1 && n.seen_on_model > 0) { el('text', { x: p.x + p.w - 4, y: p.y - 2, class: 'small', 'text-anchor': 'end' }, g).textContent = `fixed ${n.seen_on_model}× on this model`; }
  });
}
window.graph = graph;
</script>
</body>
</html>
