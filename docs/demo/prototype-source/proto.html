<!doctype html>
<html><head><meta charset="utf-8"><title>Ustad prototype walkthrough</title>
<style>
  :root { --c: #39e6ff; --v: #8b7bff; --g: #34d399; --o: #ff8a3d; --ink: #e8f4ff; --mut: #8aa0c0; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, sans-serif; color: var(--ink);
    background: radial-gradient(ellipse 70% 90% at 72% 50%, #10203f 0%, #070d1a 55%, #04070f 100%); }
  .abs { position: absolute; }
  #grid { inset: 0; background-image: linear-gradient(rgba(57,230,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(57,230,255,.05) 1px, transparent 1px);
          background-size: 64px 64px; mask-image: radial-gradient(ellipse at 70% 50%, #000 20%, transparent 75%); }
  #brand { left: 120px; top: 70px; display: flex; align-items: center; gap: 16px; font-weight: 900; letter-spacing: .3em; font-size: 22px; }
  #brand img { width: 52px; height: 52px; border-radius: 12px; }
  #brand span { color: var(--mut); font-weight: 600; letter-spacing: .12em; font-size: 16px; margin-left: 8px; }
  #left { left: 120px; top: 250px; width: 900px; }
  #step { font-size: 22px; letter-spacing: .3em; font-weight: 800; color: var(--c); }
  #ttl { font-size: 76px; font-weight: 900; letter-spacing: -.02em; margin-top: 14px; line-height: 1.04; }
  #desc { font-size: 32px; line-height: 1.42; color: #c7d6ea; margin-top: 26px; }
  #code { display: inline-block; margin-top: 34px; font-family: "DejaVu Sans Mono", monospace; font-size: 20px; color: #bfeaff; padding: 12px 18px;
          border-radius: 12px; background: rgba(57,230,255,.08); border: 1px solid rgba(57,230,255,.3); }
  #code b { color: var(--mut); font-family: Inter; font-weight: 700; margin-right: 10px; font-size: 16px; letter-spacing: .14em; }
  #progress { left: 120px; top: 205px; display: flex; gap: 8px; } #progress i { width: 34px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); }
  #progress i.on { background: var(--c); box-shadow: 0 0 10px var(--c); }
  #phone { left: 1300px; top: 40px; width: 476px; height: 1000px; border-radius: 64px; background: #0b0f17; padding: 14px; box-sizing: border-box;
           box-shadow: 0 40px 120px rgba(0,0,0,.7), 0 0 0 2px #2a3446, inset 0 0 0 2px #1a2130, 0 0 80px rgba(57,230,255,.12); }
  #screen { position: relative; width: 448px; height: 972px; border-radius: 52px; overflow: hidden; background: #060b16; }
  #screen img.s { position: absolute; inset: 0; width: 448px; height: 972px; object-fit: cover; opacity: 0; }
  #screen img.fit { object-fit: contain; background: #060b16; }
  #car { position: absolute; opacity: 0; }
  #notch { position: absolute; left: 50%; top: 14px; width: 120px; height: 32px; margin-left: -60px; border-radius: 20px; background: #000; z-index: 3; }
  #tap { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 4px solid #fff; background: rgba(255,255,255,.18); opacity: 0; z-index: 4; }
  #lensimg { left: 120px; top: 420px; width: 600px; border-radius: 22px; opacity: 0; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  #subs { left: 120px; bottom: 150px; width: 1060px; display: flex; gap: 18px; align-items: center; }
  #subs .who { font-size: 14px; letter-spacing: .24em; font-weight: 900; padding: 8px 12px; border-radius: 10px; white-space: nowrap; background: rgba(255,255,255,.12); }
  #subs .who.ustad { background: linear-gradient(90deg, var(--c), var(--v)); color: #00101a; }
  #subs .txt { font-size: 27px; line-height: 1.35; font-weight: 500; color: #e8f4ff; } #subs .dim { opacity: .3; }
  #wave { display: flex; gap: 4px; align-items: center; height: 40px; } #wave b { width: 5px; border-radius: 3px; background: var(--c); }
  #note { left: 120px; bottom: 56px; font-size: 17px; color: var(--mut); letter-spacing: .02em; }
  #note b { color: #cfe0f2; }
  #center { inset: 0; display: grid; place-items: center; text-align: center; }
  #center .big { font-size: 150px; font-weight: 900; letter-spacing: .3em; margin-left: .3em; background: linear-gradient(180deg, #fff, #9fdcff 60%, #5b8cff); -webkit-background-clip: text; color: transparent; }
  #center .sub { font-size: 36px; color: #cfe6ff; margin-top: 10px; } #center .meta { font-size: 18px; letter-spacing: .3em; color: var(--mut); margin-top: 30px; font-weight: 700; }
  #center img { width: 150px; height: 150px; border-radius: 34px; margin: 0 auto 30px; display: block; box-shadow: 0 0 60px rgba(57,230,255,.35); }
  #fade { inset: 0; background: #000; }
</style></head>
<body>
<div id="grid" class="abs"></div>
<div id="brand" class="abs"><img src="img/icon.png">USTAD<span>PROTOTYPE WALKTHROUGH · v2.7</span></div>
<div id="progress" class="abs"></div>
<div id="left" class="abs"><div id="step"></div><div id="ttl"></div><div id="desc"></div><div id="code"><b>FROM THE CODE</b><span id="codet"></span></div></div>
<img id="lensimg" class="abs" src="img/raybans.png">
<div id="phone" class="abs"><div id="screen"><div id="notch"></div><img id="car"><div id="tap"></div></div></div>
<div id="subs" class="abs"><div class="who" id="who">NARRATOR</div><div id="wave"></div><div class="txt" id="txt"></div></div>
<div id="note" class="abs">Screens rendered from <b>Ustad's source code (v2.7)</b> · 3D from the app's own <b>three.js files</b> · glasses input via Meta's <b>Mock Device Kit</b> (engine-bay photo simulated)</div>
<div id="center" class="abs"><div><img src="img/icon.png"><div class="big">USTAD</div><div class="sub" id="csub"></div><div class="meta" id="cmeta"></div></div></div>
<div id="fade" class="abs"></div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), seg = (t, a, b) => clamp((t - a) / (b - a)), sm = x => x * x * (3 - 2 * x);
const fio = (t, a, b, f = .45) => Math.min(sm(seg(t, a, a + f)), 1 - sm(seg(t, b - f, b)));
let TL = null, imgs = {};
window.init = tl => {
  TL = tl;
  tl.scenes.forEach(s => { if (s.phone && !imgs[s.phone]) { const i = document.createElement('img'); i.className = 's' + (s.phone === 'dash.png' ? ' fit' : ''); i.src = 'img/' + s.phone; $('screen').insertBefore(i, $('car')); imgs[s.phone] = i; } });
  const steps = tl.scenes.filter(s => s.n); steps.forEach(() => $('progress').appendChild(document.createElement('i')));
  for (let i = 0; i < 24; i++) $('wave').appendChild(document.createElement('b'));
  // car frames sit where the app's WebView sits (rect found in the rendered screen: 88,892 → 991,1579 of 1080×2340)
  const k = 448 / 1080; Object.assign($('car').style, { left: 88 * k - 2 + 'px', top: 892 * k - (2340 * k - 972) / 2 - 2 + 'px', width: 904 * k + 4 + 'px', height: 688 * k + 4 + 'px', objectFit: 'cover' });
  return Promise.all(Object.values(imgs).map(i => i.decode()));
};
window.setT = async t => {
  const S = TL.scenes, cur = S.find(s => t >= s.t0 && t < s.t1) || S[S.length - 1];
  const steps = S.filter(s => s.n);
  // left text
  const lk = cur.n ? fio(t, cur.t0 + .1, cur.t1 - .05) : 0;
  $('left').style.opacity = lk; $('left').style.transform = `translateY(${18 * (1 - sm(seg(t, cur.t0 + .1, cur.t0 + .6)))}px)`;
  if (cur.n) { $('step').textContent = `STEP ${cur.n} OF ${steps.length}`; $('ttl').textContent = cur.title; $('desc').textContent = cur.desc; $('codet').textContent = cur.code; }
  $('progress').querySelectorAll('i').forEach((e, i) => e.className = cur.n && i < +cur.n ? 'on' : '');
  $('progress').style.opacity = cur.n ? 1 : 0;
  // phone screens (cross-fade between consecutive screens)
  const phoneOn = S.some(s => s.phone && t >= s.t0 - .4 && t < s.t1 + .4);
  $('phone').style.opacity = sm(clamp(phoneOn ? Math.min(seg(t, S[1].t0 - .6, S[1].t0), 1 - seg(t, S[S.length - 1].t0 - .1, S[S.length - 1].t0 + .5)) : 0));
  $('phone').style.transform = `translateY(${30 * (1 - sm(seg(t, S[1].t0 - .6, S[1].t0 + .3)))}px)`;
  Object.entries(imgs).forEach(([ph, el]) => {
    let o = 0; S.forEach(s => { if (s.phone === ph) o = Math.max(o, Math.min(sm(seg(t, s.t0 - .25, s.t0 + .25)), 1 - sm(seg(t, s.t1 - .25, s.t1 + .25)))); });
    if (ph === 'v_coach.png') { const a = S.find(s => s.key === 'coach'), b = S.find(s => s.key === 'lens'); o = Math.min(sm(seg(t, a.t0 - .25, a.t0 + .25)), 1 - sm(seg(t, b.t1 - .25, b.t1 + .25))); }
    el.style.opacity = o;
  });
  // the 3D car inside the result screen
  const R = S.find(s => s.key === 'result');
  const inR = t >= R.t0 - .25 && t < R.t1 + .25;
  $('car').style.opacity = inR ? Math.min(sm(seg(t, R.t0 - .25, R.t0 + .25)), 1 - sm(seg(t, R.t1 - .25, R.t1 + .25))) : 0;
  if (inR) { const f = clamp(Math.floor((t - R.t0) * 30), 0, 359); const src = `car/c${String(f).padStart(4, '0')}.png`;
    if (!$('car').src.endsWith(src)) { $('car').src = src; await $('car').decode(); } }
  // taps: "Take a photo" in inspect, "Explode" in result
  const I = S.find(s => s.key === 'inspect');
  const taps = [[I.t1 - 1.3, 224, 352], [R.t0 + 4.6, 386, 560]];
  let to = 0; taps.forEach(([tt, x, y]) => { const k = seg(t, tt, tt + .6); if (k > 0 && k < 1) { to = 1 - k; Object.assign($('tap').style, { left: x + 'px', top: y + 'px', transform: `scale(${.6 + k * .8})` }); } });
  $('tap').style.opacity = to;
  // Ray-Ban Display image during the lens step
  const Ls = S.find(s => s.key === 'lens');
  $('lensimg').style.opacity = fio(t, Ls.t0 + .3, Ls.t1 - .1); $('left').style.top = (t >= Ls.t0 && t < Ls.t1) ? '230px' : '250px';
  $('progress').style.top = '205px';
  $('desc').style.display = (t >= Ls.t0 && t < Ls.t1) ? 'none' : ''; $('code').style.marginTop = (t >= Ls.t0 && t < Ls.t1) ? '18px' : '34px';
  // title / end
  const first = S[0], last = S[S.length - 1];
  const ck = t < first.t1 ? fio(t, .4, first.t1 - .1) : fio(t, last.t0 + .3, last.t1 + 1, .6);
  $('center').style.opacity = ck; $('csub').textContent = t < first.t1 ? 'Prototype walkthrough · the real app, v2.7' : 'One expert’s knowledge, in every technician’s glasses';
  $('cmeta').textContent = t < first.t1 ? 'ANDROID · META WEARABLES DEVICE ACCESS TOOLKIT · MOCK DEVICE KIT' : 'GITHUB.COM/SHAAHA7/META-1';
  $('brand').style.opacity = 1 - ck;
  // subtitles + waveform
  const L = TL.lines.find(l => t >= l.t - .1 && t < l.t + l.dur + .3);
  $('subs').style.opacity = L && !(t < first.t1 || t >= last.t0) ? fio(t, L.t - .1, L.t + L.dur + .3, .15) : 0;
  if (L) {
    $('who').className = 'who ' + L.who; $('who').textContent = L.who === 'ustad' ? 'USTAD (IN THE APP)' : 'NARRATOR';
    const w = L.text.split(' '), n = Math.ceil(w.length * clamp((t - L.t) / (L.dur * .92)));
    $('txt').innerHTML = w.slice(0, n).join(' ') + ' <span class="dim">' + w.slice(n).join(' ') + '</span>';
    const amp = L.env[Math.floor((t - L.t) * 30)] || 0;
    $('wave').querySelectorAll('b').forEach((b, i) => { b.style.height = 6 + 32 * amp * (.45 + .55 * Math.abs(Math.sin(i * 1.7 + t * 18))) + 'px'; b.style.background = L.who === 'ustad' ? `hsl(${190 + i * 2.4},100%,62%)` : '#fff'; });
  }
  $('note').style.opacity = 1 - ck;
  $('fade').style.opacity = Math.max(1 - sm(seg(t, 0, .7)), sm(seg(t, TL.total - .9, TL.total)));
};
</script>
</body></html>
